[package]
name = "next-step"
version = "0.1.0"
description = "Spots the emails you're avoiding and turns each into one tiny next step"
edition = "2021"
rust-version = "1.77"

[lib]
name = "next_step_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2.4"
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
